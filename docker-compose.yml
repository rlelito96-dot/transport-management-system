services:
  db:
    image: postgres:16
    restart: always
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile

    container_name: tms1-api
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file:
      - .env

volumes:
  db_data:
